[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-hospital-mcp"
version = "1.0.0"
description = "MCP service exposing the Go Pet Hospital REST API to AI agents (MCP 2026-07-28, SDK 2.x MCPServer, stateless Streamable HTTP)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pet Hospital MCP Teaching" }]
dependencies = [
    "mcp==2.0.0",
    "httpx>=0.27",
    "pydantic>=2.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx2>=2.5.0",
]

[project.scripts]
pet-hospital-mcp = "pet_hospital_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = "-q"
