; config.example.ini —— 配置模板（不含任何真实密钥）
; 使用方式：复制一份为 config.ini，再把带 <...> 占位的地方替换成你自己的值。
; 提示：直接运行 python run.py 时若当前目录没有 config.ini，
;       TAgent 会自动生成一份（mock 信息）并弹窗提示。
; 注意：config.ini 已被 .gitignore 忽略，不会提交到仓库，密钥不会外泄。

[llm]
; LLM 接口地址（OpenAI 兼容的 base_url，代码会自动拼接 /chat/completions）
; 例：https://api.openai.com/v1
; 例：https://dashscope.aliyuncs.com/compatible-mode/v1
; 例：https://api.deepseek.com
base_url = https://api.deepseek.com

; API 密钥（必填，替换成你自己的）
api_key = <YOUR_API_KEY>

; 模型名称
model = deepseek-chat

; 请求超时时间（秒），可选
timeout = 60

; 采样温度（可选，留空表示使用服务端默认值）
; temperature = 0.3

; 单次回复最大 token（可选）——复述网页原文等长输出场景建议显式给足
max_tokens = 8192


; ===== Agent 运行策略 =====
[agent]
; 单轮对话中允许的最大「模型请求 → 工具执行」循环次数
max_tool_rounds = 10

; 读取单个文件的最大字节数（超出自动截断并提示）
max_read_bytes = 1048576

; 工具结果在界面上的最大展示长度（发给模型的仍是完整结果）
max_tool_display_len = 300

; 会话历史最多保留的消息条数，0 表示不限制
history_limit = 0

; 是否启用系统提示词
enable_system_prompt = true

; Skill 根目录（可选）。留空 = 程序启动时的工作目录\.agents\skills
; skills_dir = D:\shared\my-skills

; 系统提示词（可选；省略则使用内置默认）
; system_prompt =


; ===== 界面表现（TUI）=====
; 这一段的数值直接影响手感与布局，可按终端尺寸自行调整
[ui]
; 后台事件回流间隔（毫秒）：越小越顺滑，越大越省 CPU
event_drain_interval_ms = 33

; 流式输出重绘间隔（毫秒）
stream_flush_interval_ms = 50

; 「思考中」转圈动画的帧间隔（毫秒）
spinner_interval_ms = 83

; 工具面板里单条结果的预览字符数
tool_preview_chars = 400

; 左侧边栏（MCP 服务器与工具）宽度，单位「列」
sidebar_width = 30

; 右侧工具活动面板宽度
tool_panel_width = 42

; 斜杠命令补全面板最多显示几行
command_panel_rows = 8

; 输入框高度（行，含上边框）
input_height = 7


; ===== 会话持久化 =====
; /new 前、每轮结束、退出时都会自动保存；/resume 从这里读取
[sessions]
; 会话目录（可选）。留空 = 启动目录\.agents\sessions
; dir = D:\shared\tagent-sessions

; 是否自动保存（关闭后只能用 /save 手动保存）
autosave = true

; /resume 列表最多展示多少条历史会话
max_listed = 50


; ===== AGENTS.md 项目约定 =====
; 「一次注入、全程复用」：新会话首次加载时把文件内容作为一条消息放进历史，
; 之后每轮直接复用，不会重复消耗 token
[agent_docs]
enabled = true
filename = AGENTS.md
; 注入内容最大字节数（超出截断，避免一次吃掉过多上下文）
max_bytes = 32768


; ===== MCP（外部工具服务器）=====
[mcp]
; 是否启用 MCP。关闭后不会读取 .mcp.json，也不会连接任何服务器
enabled = true

; MCP 配置文件路径（可选）。留空 = 启动目录\.mcp.json
; config = D:\shared\.mcp.json

; 单次 MCP 工具调用超时（秒）
timeout = 60

; 单个 MCP Server 的连接与握手超时（秒）——连不上只会跳过该服务器
; TUI 里这些连接在后台进行，不会卡住启动
connect_timeout = 15

; 单次工具结果保留的最大字符数（超出保留头 70% + 尾 30%）
max_result_chars = 20000

; 注入模型上下文时单个工具描述的最大字符数
tool_description_chars = 1500


; ===== 上下文窗口 / 压缩 / 检索 =====
[context]
; 模型上下文窗口大小（token）。0 或省略 = 未知，按默认 128k 处理并标注「默认」
; 常见值：deepseek-chat 128000 / gpt-4o 128000 / qwen-max 32768
window = 0

; 上下文占用达到窗口的该比例时提示并暂停普通输入
threshold = 0.8

; 归档目录（可选）。留空 = 启动目录\.agents\context
; dir = D:\shared\tagent-context

; 压缩摘要的目标 token 数（约数；超出 2 倍字符数会本地截断）
summary_tokens = 5000

; recallContext 单次返回内容的最大字符数
recall_max_chars = 8000


; ===== 本地命令执行 =====
[cli]
; 单条命令的超时（秒）；超时会把已产生的输出交给模型
timeout = 30

; stdout / stderr 保留的最大字符数
max_stdout_chars = 8000
max_stderr_chars = 4000


; ===== 网页抓取 =====
[webfetch]
; 整体超时 / 连接超时（秒）
timeout = 25
connect_timeout = 10

; 单个页面 HTML 的最大字节数（防止超大页面拖垮解析），约 8 MiB
max_html_bytes = 8388608


; ===== Web 界面（python run.py --ui web）=====
[web]
; 监听地址：127.0.0.1 只允许本机访问；要让手机/同事访问改成 0.0.0.0
host = 127.0.0.1

; 端口
port = 8760

; 启动后自动打开默认浏览器
open_browser = true

; 前端构建产物目录；留空 = 项目根的 frontend/dist
; assets_dir = frontend/dist

; SSE 心跳间隔（秒）：长时间无输出时保活，防止中间代理掐断
heartbeat_seconds = 15


; ===== 联网搜索（可选，不配置则 searchwdb 工具调用时返回错误提示）=====
[search]
; 百度千帆智能搜索（生成版）API 密钥
baidu_qianfan_api_key = <YOUR_QIANFAN_API_KEY>

; 搜索接口地址（可选，默认即千帆智能搜索 v2）
; base_url = https://qianfan.baidubce.com/v2/ai_search

; 搜索请求超时时间（秒，可选，默认 30）
; timeout = 30
